# ==============================================================================
# SonarQube Cloud (SonarCloud) Configuration
# Repository: Jose-Pablo-Martinez/lectorPobre-catalog
# ==============================================================================

# Identificadores del proyecto en SonarQube Cloud
sonar.projectKey=Jose-Pablo-Martinez_lectorPobre-catalog
sonar.organization=jose-pablo
sonar.projectName=lectorPobre-catalog

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Rutas de código fuente y pruebas
sonar.sources=api,components,composables,layouts,pages,pkg,plugins,scripts/recommendations,app.vue
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts

# Exclusiones de análisis general
# En Go, los archivos *_test.go residen junto al código por convención de `go test`.
# Se excluyen de la inspección de código fuente de producción para evitar falsos duplicados (CPD) o code smells en tests.
sonar.exclusions=node_modules/**,.nuxt/**,.output/**,dist/**,sanity/**,public/**,coverage/**,test-results/**,playwright-report/**,scripts/recommendations/.cache/**,product-vectors.json,**/*.d.ts,**/*_test.go

# Exclusión explícita de detección de código duplicado (CPD) en archivos de test
sonar.cpd.exclusions=tests/**,**/*_test.go

# Exclusiones de cobertura (archivos auxiliares, de configuración, vistas E2E y tests)
# Layouts, pages y app.vue son vistas evaluadas vía Playwright E2E (VyV §5, §10.2), no en unitarias Vitest.
sonar.coverage.exclusions=tests/**,sanity/**,node_modules/**,scripts/**,**/*.d.ts,**/*.config.ts,**/*.config.js,types/**,layouts/**,pages/**,app.vue,**/*_test.go

# Reportes de cobertura de pruebas unitarias
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.go.coverage.reportPaths=coverage.out
